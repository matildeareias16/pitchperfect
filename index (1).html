const pickMidi=(pool,[lo,hi])=>12*(lo+rnd(hi-lo+1)+1)+pickPC(pool);
const NO=(l,rg,o={})=>{const pool=o.pool||PCS[l],m=pickMidi(pool,rg),i=o.i||pick(insPool(l)),c=o.nc?0:l===8?rnd(31)-15:0;return{m,i,c,pool,e:[{m,i,c,d:1}]}};
